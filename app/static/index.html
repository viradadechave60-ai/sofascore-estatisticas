<!doctype html><html lang="pt-BR"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analisador de Chutes</title><style>body{font-family:system-ui;margin:0;background:#f4f5f7;color:#151515}.box{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}button{background:#111;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:30px;font-weight:800}.ok{font-weight:800}.muted{color:#666}.err{color:#b00020}</style><div class="box"><h1>⚽ Analisador de Chutes</h1><p class="muted">Dados exclusivamente do Sofascore. Informe jogador, linha e odd.</p><div class="card"><input id="name" placeholder="Nome do jogador"><div class="grid"><input id="line" type="number" step="0.5" value="1.5" placeholder="Linha"><input id="odd" type="number" step="0.01" value="1.70" placeholder="Odd"></div><button onclick="go()">ANALISAR</button><div id="msg"></div></div><div id="out"></div></div><script>async function go(){let m=document.querySelector('#msg'),o=document.querySelector('#out');m.textContent='Consultando Sofascore...';o.innerHTML='';try{let n=encodeURIComponent(document.querySelector('#name').value),l=document.querySelector('#line').value,od=document.querySelector('#odd').value;let r=await fetch(`/api/analyze?name=${n}&line=${l}&odd=${od}`);let d=await r.json();if(!r.ok)throw Error(d.detail||'Erro');m.textContent='';o.innerHTML=`<div class="card"><h2>${d.player.name}</h2><p>${d.team.name||''}${d.fixture?` × ${d.fixture.awayTeam.name||''}`:''}</p><div class="grid"><div>Chutes/90<br><b>${d.seasonShots90.toFixed(2)}</b></div><div>Últimos 5<br><b>${d.last5.toFixed(2)}</b></div><div>Últimos 10<br><b>${d.last10.toFixed(2)}</b></div><div>Minutos esperados<br><b>${d.expectedMinutes.toFixed(0)}</b></div></div><hr><p>Chutes esperados</p><div class="big">${d.expectedShots.toFixed(2)}</div><div class="grid"><div>Probabilidade<br><b>${(d.probability*100).toFixed(1)}%</b></div><div>Prob. da odd<br><b>${(d.impliedProbability*100).toFixed(1)}%</b></div><div>Edge<br><b>${(d.edge*100).toFixed(1)} p.p.</b></div><div>Nota<br><b>${d.score.toFixed(0)}/100</b></div></div><h2> ${d.signal==='APROVAR'?'🟢':d.signal==='INTERESSANTE'?'🟡':'🔴'} ${d.signal}</h2><p class="muted">A probabilidade é uma estimativa estatística, não garantia de resultado.</p></div>`}catch(e){m.innerHTML=`<p class="err">${e.message}</p>`}}</script></html>
